name: Build APK School Days (Indonesia)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Susun ulang isi APK
        run: |
          set -euo pipefail

          # Folder sumber: bisa "school_days/" atau langsung di root repo
          if [ -f school_days/AndroidManifest.xml ]; then SRC=school_days; else SRC=.; fi

          rm -rf build && mkdir -p build/apk
          cp "$SRC/AndroidManifest.xml" "$SRC/classes.dex" "$SRC/resources.arsc" build/apk/

          # Zip bagian (assets, lib, res, META-INF) dibuka kembali ke akar APK
          for z in META-INF assets lib res; do
            unzip -q -o "$SRC/$z.zip" -d build/apk
          done

          # Buang tanda tangan lama, nanti ditandatangani ulang
          rm -f build/apk/META-INF/*.SF build/apk/META-INF/*.RSA \
                build/apk/META-INF/*.DSA build/apk/META-INF/*.EC \
                build/apk/META-INF/MANIFEST.MF

          # Timpa dengan berkas terjemahan (opsional): isi folder terjemahan/
          # mengikuti struktur APK, contoh: terjemahan/assets/Game.swf
          if [ -d terjemahan ]; then
            cp -rT terjemahan build/apk
            echo "Berkas terjemahan diterapkan:"
            (cd terjemahan && find . -type f)
          fi

      - name: Kemas jadi APK
        run: |
          set -euo pipefail
          cd build/apk
          # resources.arsc dan .so harus tidak dikompres
          zip -X -0 -r ../unaligned.apk resources.arsc lib
          zip -X -9 -r ../unaligned.apk . -x resources.arsc 'lib/*'

      - name: Zipalign
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "BT=$BT" >> "$GITHUB_ENV"
          "$BT/zipalign" -f -p 4 build/unaligned.apk build/aligned.apk

      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > build/release.jks
            echo "KS_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KS_ALIAS=key" >> "$GITHUB_ENV"
          else
            echo "Secret keystore tidak ada, membuat keystore sementara."
            keytool -genkeypair -keystore build/release.jks -storepass android \
              -keypass android -alias key -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=School Days ID"
            echo "KS_PASS=android" >> "$GITHUB_ENV"
            echo "KS_ALIAS=key" >> "$GITHUB_ENV"
          fi

      - name: Tanda tangan APK
        run: |
          set -euo pipefail
          "$BT/apksigner" sign \
            --ks build/release.jks --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --out SchoolDays-ID.apk build/aligned.apk
          "$BT/apksigner" verify --verbose SchoolDays-ID.apk

      - name: Unggah hasil build
        uses: actions/upload-artifact@v4
        with:
          name: SchoolDays-ID
          path: SchoolDays-ID.apk

      - name: Buat rilis (khusus tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SchoolDays-ID.apk
